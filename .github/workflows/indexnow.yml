name: IndexNow
on:
  deployment_status:
  workflow_dispatch:
jobs:
  submit:
    # After a successful production deploy, or by hand. The script sends nothing while SITE_INDEXABLE is off.
    if: github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run indexnow
        env:
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
          SITE_INDEXABLE: ${{ vars.SITE_INDEXABLE }}
          NEXT_PUBLIC_SPANISH: ${{ vars.NEXT_PUBLIC_SPANISH }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
